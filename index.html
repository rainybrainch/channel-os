<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RBAI Channel OS</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root {
    --accent: #c9a84c;
    --bg: #0d0d0d;
    --surface: #1a1a1a;
    --surface2: #242424;
    --text: #e8e8e8;
    --text-muted: #888;
    --border: #333;
    --char-color: #c9a84c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Noto Serif JP','Hiragino Serif',serif; min-height: 100vh; display: flex; flex-direction: column; }

  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 1.1rem; font-weight: 700; color: var(--accent); letter-spacing: .05em; }
  header span { color: var(--text-muted); font-size: .8rem; }

  .layout { display: flex; flex: 1; overflow: hidden; }

  aside { width: 220px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; flex-shrink: 0; }
  .sidebar-title { padding: 14px 16px 8px; font-size: .7rem; color: var(--text-muted); letter-spacing: .1em; text-transform: uppercase; }
  .char-item { padding: 12px 16px; cursor: pointer; border-left: 3px solid transparent; transition: all .2s; display: flex; align-items: center; gap: 10px; }
  .char-item:hover { background: var(--surface2); }
  .char-item.active { border-left-color: var(--char-color); background: var(--surface2); }
  .char-icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; overflow: hidden; }
  .char-icon img { width: 100%; height: 100%; object-fit: cover; }
  .char-name { font-size: .9rem; font-weight: 600; }
  .char-theme { font-size: .7rem; color: var(--text-muted); }
  .add-char-btn { margin: 12px; padding: 10px; background: none; border: 1px dashed var(--border); border-radius: 6px; color: var(--text-muted); cursor: pointer; font-size: .82rem; transition: all .2s; }
  .add-char-btn:hover { border-color: var(--accent); color: var(--accent); }

  main { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }

  .char-header { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px 24px; display: flex; align-items: center; gap: 16px; border-left: 4px solid var(--char-color); }
  .char-header-icon { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; overflow: hidden; flex-shrink: 0; }
  .char-header-icon img { width: 100%; height: 100%; object-fit: cover; }
  .char-header-info h2 { font-size: 1.3rem; color: var(--char-color); }
  .char-header-info p { font-size: .82rem; color: var(--text-muted); margin-top: 2px; }
  .char-header-badges { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; font-size: .72rem; color: var(--text-muted); }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .tab { padding: 8px 14px; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: .82rem; border-bottom: 2px solid transparent; transition: all .2s; font-family: inherit; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--char-color); border-bottom-color: var(--char-color); }

  .panel { display: none; flex-direction: column; gap: 16px; }
  .panel.active { display: flex; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 18px 20px; }
  .card-title { font-size: .78rem; color: var(--text-muted); letter-spacing: .08em; margin-bottom: 12px; text-transform: uppercase; }

  .form-row { display: flex; gap: 10px; align-items: flex-end; }
  .form-row.col { flex-direction: column; align-items: stretch; }
  label { font-size: .8rem; color: var(--text-muted); margin-bottom: 4px; display: block; }
  input, textarea, select { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 8px 12px; font-family: inherit; font-size: .88rem; width: 100%; transition: border-color .2s; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--char-color); }
  textarea { resize: vertical; min-height: 80px; }

  .btn { padding: 9px 18px; border-radius: 6px; border: none; cursor: pointer; font-size: .85rem; font-family: inherit; font-weight: 600; transition: all .2s; white-space: nowrap; }
  .btn-primary { background: var(--char-color); color: #0d0d0d; }
  .btn-primary:hover { opacity: .85; }
  .btn-secondary { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }
  .btn-secondary:hover { border-color: var(--char-color); }
  .btn-sm { padding: 6px 12px; font-size: .78rem; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .result-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 14px; font-size: .85rem; line-height: 1.7; white-space: pre-wrap; word-break: break-word; min-height: 80px; color: var(--text); }
  .result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .result-label { font-size: .75rem; color: var(--char-color); font-weight: 700; }

  .plan-grid { display: flex; flex-direction: column; gap: 10px; }
  .plan-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; cursor: pointer; transition: all .2s; }
  .plan-card:hover { border-color: var(--char-color); }
  .plan-card.selected { border-color: var(--char-color); background: #1e1a14; }
  .plan-card-label { font-size: .72rem; color: var(--char-color); font-weight: 700; margin-bottom: 4px; }
  .plan-card-title { font-size: .95rem; font-weight: 600; margin-bottom: 4px; }
  .plan-card-desc { font-size: .8rem; color: var(--text-muted); line-height: 1.5; }

  .schedule-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: 8px; }
  .schedule-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; font-size: .8rem; }
  .schedule-date { color: var(--char-color); font-weight: 700; margin-bottom: 4px; }
  .schedule-ep { color: var(--text-muted); font-size: .75rem; }

  /* ── Asset Manager ── */
  .asset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px,1fr)); gap: 10px; }
  .asset-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; cursor: pointer; transition: all .2s; position: relative; }
  .asset-card:hover { border-color: var(--char-color); }
  .asset-card.selected { border-color: var(--char-color); border-width: 2px; }
  .asset-thumb { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--surface); display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 2rem; }
  .asset-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .asset-name { padding: 6px 8px; font-size: .72rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .asset-use-btn { position: absolute; top: 4px; right: 4px; background: var(--char-color); color: #0d0d0d; border: none; border-radius: 4px; padding: 3px 7px; font-size: .68rem; font-weight: 700; cursor: pointer; opacity: 0; transition: opacity .2s; }
  .asset-card:hover .asset-use-btn { opacity: 1; }

  .upload-zone { border: 2px dashed var(--border); border-radius: 8px; padding: 32px; text-align: center; cursor: pointer; transition: all .2s; color: var(--text-muted); }
  .upload-zone:hover, .upload-zone.drag { border-color: var(--char-color); color: var(--char-color); }
  .upload-zone .upload-icon { font-size: 2rem; margin-bottom: 8px; }
  .upload-zone p { font-size: .82rem; }

  /* ── Storyboard ── */
  .storyboard-grid { display: flex; flex-direction: column; gap: 14px; }
  .sb-scene { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .sb-scene-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
  .sb-scene-badge { background: var(--char-color); color: #0d0d0d; border-radius: 4px; padding: 2px 8px; font-size: .72rem; font-weight: 700; }
  .sb-scene-time { font-size: .75rem; color: var(--text-muted); }
  .sb-scene-body { display: grid; grid-template-columns: 160px 1fr; gap: 0; }
  .sb-image-col { border-right: 1px solid var(--border); padding: 12px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .sb-image-preview { width: 136px; height: 90px; object-fit: cover; border-radius: 6px; background: var(--surface); display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 1.8rem; border: 1px solid var(--border); overflow: hidden; }
  .sb-image-preview img { width: 100%; height: 100%; object-fit: cover; }
  .sb-text-col { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .sb-script-lines { font-size: .78rem; color: var(--text-muted); line-height: 1.6; background: var(--surface); border-radius: 4px; padding: 8px 10px; max-height: 80px; overflow-y: auto; }
  .sb-prompt-row { display: flex; gap: 6px; }
  .sb-prompt-input { flex: 1; font-size: .8rem; padding: 6px 10px; }
  @media (max-width: 600px) { .sb-scene-body { grid-template-columns: 1fr; } .sb-image-col { border-right: none; border-bottom: 1px solid var(--border); } }

  /* ── Scene Composer ── */
  .scene-layout { display: grid; grid-template-columns: 1fr 280px; gap: 16px; }
  .canvas-wrap { background: #000; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; }
  #sceneCanvas { display: block; max-width: 100%; max-height: 460px; }
  .scene-controls { display: flex; flex-direction: column; gap: 12px; }
  .format-toggle { display: flex; gap: 6px; }
  .format-btn { flex: 1; padding: 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text-muted); cursor: pointer; font-size: .78rem; text-align: center; transition: all .2s; }
  .format-btn.active { border-color: var(--char-color); color: var(--char-color); background: #1e1a14; }
  .layer-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; display: flex; align-items: center; gap: 8px; font-size: .82rem; }
  .layer-thumb { width: 32px; height: 32px; object-fit: cover; border-radius: 4px; background: var(--surface); flex-shrink: 0; }
  .export-btns { display: flex; gap: 8px; }

  .loading { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: .82rem; padding: 8px 0; }
  .spinner { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--char-color); border-radius: 50%; animation: spin .8s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty { text-align: center; padding: 48px 24px; color: var(--text-muted); }
  .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
  .empty h3 { font-size: 1rem; margin-bottom: 6px; color: var(--text); }
  .empty p { font-size: .82rem; line-height: 1.6; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 24px; width: 90%; max-width: 460px; display: flex; flex-direction: column; gap: 14px; max-height: 90vh; overflow-y: auto; }
  .modal h2 { font-size: 1rem; color: var(--accent); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  @media (max-width: 768px) {
    aside { width: 60px; }
    .char-name, .char-theme, .sidebar-title { display: none; }
    .char-item { justify-content: center; padding: 12px 8px; }
    main { padding: 16px; }
    .scene-layout { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>🎬 RBAI Channel OS</h1>
  <span id="headerSub">キャラクターを選択してください</span>
  <span id="syncStatus" style="margin-left:auto;font-size:.75rem;color:var(--text-muted);">— Drive未確認</span>
  <span id="saveIndicator" style="margin-left:8px;font-size:.75rem;color:var(--text-muted);opacity:0;transition:opacity .5s;">💾 保存済</span>
  <button onclick="switchTab('settings')" style="margin-left:12px;background:none;border:1px solid var(--border);border-radius:6px;color:var(--text-muted);padding:6px 12px;cursor:pointer;font-size:.8rem;flex-shrink:0;" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">⚙️ 設定</button>
</header>

<div class="layout">
  <aside>
    <div class="sidebar-title">キャラクター</div>
    <div id="charList"></div>
    <div class="sidebar-title" id="epSidebarTitle" style="display:none;margin-top:8px;border-top:1px solid var(--border);padding-top:14px;">動画プロジェクト</div>
    <div id="episodeList"></div>
    <button class="add-char-btn" onclick="openAddCharModal()">＋ キャラ追加</button>
  </aside>
  <main id="mainArea">
    <div class="empty">
      <div class="empty-icon">🦁</div>
      <h3>キャラクターを選択</h3>
      <p>左のサイドバーからキャラクターを選択するか<br>新しいキャラクターを追加してください</p>
    </div>
  </main>
</div>

<!-- Add/Edit Char Modal -->
<div class="modal-overlay" id="addCharModal">
  <div class="modal">
    <h2 id="modalTitle">🎭 新しいキャラクターを追加</h2>
    <div class="form-row col"><label>キャラクター名</label><input type="text" id="newCharName" placeholder="例: ガオル"></div>
    <div class="form-row col"><label>種族・見た目</label><input type="text" id="newCharSpecies" placeholder="例: ライオン（筋トレ）"></div>
    <div class="form-row col"><label>テーマ・ジャンル</label><input type="text" id="newCharTheme" placeholder="例: 筋トレ・フィットネス"></div>
    <div class="form-row col"><label>トーン・口調</label><input type="text" id="newCharTone" placeholder="例: 熱血・ポジティブ・体育会系"></div>
    <div class="form-row col"><label>シンボルカラー</label><input type="color" id="newCharColor" value="#FF4500" style="height:40px;cursor:pointer;"></div>
    <div class="form-row col"><label>AI人格メモ</label><textarea id="newCharPersonality" placeholder="例: 熱血で前向きなライオン。ギャグ多め。" style="min-height:60px;"></textarea></div>
    <div class="form-row col"><label>YouTubeチャンネルID（任意）</label><input type="text" id="newCharChannelId" placeholder="UCxxxxxxxxxx"></div>
    <div class="form-row col"><label>Google DriveフォルダID（任意）</label><input type="text" id="newCharFolderId" placeholder="1ABCxyz...（DriveのフォルダURLの末尾）"></div>
    <div class="form-row col"><label>VOICEVOX 話者ID（任意・デフォルト: 3=ずんだもん）</label><input type="number" id="newCharVoicevox" placeholder="3" min="0" value="3"></div>
    <div class="form-row col"><label>画像生成 ChatGPT URL（任意）</label><input type="text" id="newCharGptUrl" placeholder="https://chatgpt.com/g/g-..."></div>
    <div class="form-row col"><label>画像生成 Gemini Gem URL（任意）</label><input type="text" id="newCharGemUrl" placeholder="https://gemini.google.com/gem/..."></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('addCharModal')">キャンセル</button>
      <button class="btn btn-primary" id="modalSaveBtn" onclick="saveNewChar()">追加</button>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════
//  Storage & State
// ════════════════════════════════════
const STORAGE_KEY   = 'channelos_data_v2';
const API_KEY_SK    = 'channelos_claude_api_key';
const GD_TOKEN_SK   = 'channelos_gd_token';
const GD_CLIENT_SK  = 'channelos_gd_client_id';
const GD_FOLDER_SK  = 'channelos_gd_folder_id';
const YT_TOKEN_SK   = 'channelos_yt_token';
const SA_JSON_SK    = 'channelos_sa_json';
const SA_TOKEN_SK   = 'channelos_sa_token';
const SA_EXPIRY_SK  = 'channelos_sa_expiry';
const GIST_ID_SK    = 'channelos_gist_id';
const GIST_PAT_SK   = 'channelos_gist_pat';

function saveData(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }
function defaultData() {
  return {
    characters: [{
      id: 'gaoru', name: 'ガオル', species: 'ライオン（筋トレ）',
      theme: '筋トレ・フィットネス', tone: '熱血・ポジティブ・体育会系',
      color: '#FF4500', channel_id: 'UC39C9TLzlPxvFv6Radzgbcw',
      ai_personality: '熱血で前向きなライオン。筋トレの辛さも笑いに変える。ギャグ多め。視聴者を仲間と呼ぶ。',
      icon: '🦁', avatar_url: '', drive_folder_id: '1-QySS62i1cHPNh9lHg1quqPtyZ2zIp_x'
    }, {
      id: 'luna', name: 'ルナ', species: '白狼',
      theme: '美ボディ習慣・ヨガ・ピラティス', tone: '穏やか・継続重視・丁寧',
      color: '#9b59b6', channel_id: '',
      ai_personality: '穏やかで知的な白狼。忙しい人でも続けられる美ボディ習慣を優しく導く。共感力が高く視聴者に寄り添う。',
      icon: '🐺', avatar_url: '', drive_folder_id: '1KExNqveFrILj5B9x12_mHRKL-fqI434l'
    }],
    episodes: [], schedules: [], assets: []
  };
}

function loadData() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (!saved || !saved.characters || saved.characters.length === 0) return defaultData();
    return saved;
  } catch { return defaultData(); }
}

// 旧キーを削除
['channelos_data', 'channelos_data_v1'].forEach(k => localStorage.removeItem(k));

let data = loadData();
// loadStoryboard() は定義後に呼ぶ（ページ読み込み時 renderMain より前に DOMContentLoaded で実行）

// デフォルトキャラのマージ（不足フィールドを常に補完）
{
  let changed = !data.characters || data.characters.length === 0;
  if (changed) { data = defaultData(); }
  else {
    defaultData().characters.forEach(def => {
      const existing = data.characters.find(c => c.id === def.id);
      if (!existing) {
        data.characters.push(def); changed = true;
      } else {
        // フィールドが未設定なら常にデフォルト値で補完
        ['drive_folder_id','channel_id','ai_personality','icon','color','species','theme','tone'].forEach(k => {
          if (!existing[k] && def[k]) { existing[k] = def[k]; changed = true; }
        });
      }
    });
  }
  if (changed) saveData(data);
}
let currentCharId = null;
let currentTab    = 'plan';
let selectedPlan  = null;
let generatedScript = '';
let storyboardData = {};
let generatedMeta   = null;
let editingCharId   = null;

// ── 動画プロジェクト管理 ──
let currentEpisodeId = null;

function getEpisodes() {
  const char = data.characters.find(c => c.id === currentCharId);
  if (!char) return [];
  return (data.episodes || []).filter(e => e.charId === currentCharId);
}

function newEpisode() {
  const id = 'ep_' + Date.now();
  const ep = { id, charId: currentCharId, title: '新しい動画', createdAt: new Date().toISOString(),
    plan: null, script: '', meta: null, status: 'draft' };
  data.episodes = data.episodes || [];
  data.episodes.push(ep);
  saveData(data);
  autoSaveToDrive();
  loadEpisode(id);
  renderSidebar();
}

function loadEpisode(id) {
  const ep = (data.episodes || []).find(e => e.id === id);
  if (!ep) return;
  currentEpisodeId = id;
  selectedPlan    = ep.plan   || null;
  generatedScript = ep.script || '';
  generatedMeta   = ep.meta   || null;
  renderSidebar();
  // 企画タブを再描画して内容を反映
  const char = data.characters.find(c => c.id === currentCharId);
  if (!char) return;
  const planPanel = document.getElementById('panelPlan');
  if (planPanel) planPanel.outerHTML = renderPlanPanel(char);
  const scriptPanel = document.getElementById('panelScript');
  if (scriptPanel) scriptPanel.outerHTML = renderScriptPanel(char);
  const metaPanel = document.getElementById('panelMeta');
  if (metaPanel) metaPanel.outerHTML = renderMetaPanel(char);
  switchTab('plan');
}

function saveCurrentEpisode() {
  if (!currentEpisodeId) return;
  const ep = (data.episodes || []).find(e => e.id === currentEpisodeId);
  if (!ep) return;
  ep.plan   = selectedPlan;
  ep.script = generatedScript;
  ep.meta   = generatedMeta;
  ep.updatedAt = new Date().toISOString();
  if (selectedPlan) ep.title = selectedPlan.title;
  saveData(data);
  // Drive自動保存
  autoSaveToDrive();
}

// ════════════════════════════════════
//  サービスアカウント認証（期限切れなし）
// ════════════════════════════════════
async function getGDToken() {
  const saJson = localStorage.getItem(SA_JSON_SK);
  if (saJson) {
    const now = Date.now();
    const expiry = parseInt(localStorage.getItem(SA_EXPIRY_SK) || '0');
    if (expiry - now > 5 * 60 * 1000) return localStorage.getItem(SA_TOKEN_SK);
    try { return await fetchSAToken(JSON.parse(saJson)); } catch(e) { showToast('SA認証エラー: ' + e.message); return null; }
  }
  return localStorage.getItem(GD_TOKEN_SK);
}

async function fetchSAToken(sa) {
  const now = Math.floor(Date.now() / 1000);
  const b64 = s => btoa(unescape(encodeURIComponent(JSON.stringify(s)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
  const header = { alg: 'RS256', typ: 'JWT' };
  const claim  = { iss: sa.client_email, scope: 'https://www.googleapis.com/auth/drive', aud: 'https://oauth2.googleapis.com/token', exp: now+3600, iat: now };
  const sigInput = `${b64(header)}.${b64(claim)}`;
  const pem = sa.private_key.replace(/-----[^\n]+-----/g,'').replace(/\s/g,'');
  const der = Uint8Array.from(atob(pem), c => c.charCodeAt(0));
  const key = await crypto.subtle.importKey('pkcs8', der.buffer, { name:'RSASSA-PKCS1-v1_5', hash:'SHA-256' }, false, ['sign']);
  const sig = await crypto.subtle.sign('RSASSA-PKCS1-v1_5', key, new TextEncoder().encode(sigInput));
  const sigB64 = btoa(String.fromCharCode(...new Uint8Array(sig))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
  const jwt = `${sigInput}.${sigB64}`;
  const res = await fetch('https://oauth2.googleapis.com/token', {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: `grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=${jwt}`
  });
  if (!res.ok) throw new Error('SA token failed: ' + res.status);
  const json = await res.json();
  localStorage.setItem(SA_TOKEN_SK, json.access_token);
  localStorage.setItem(SA_EXPIRY_SK, String(Date.now() + json.expires_in * 1000));
  return json.access_token;
}

async function loadGistConfig() {

  if (!gistId || !pat) { showToast('設定タブでGist IDとPATを入力してください'); return; }

    const res = await fetch(`https://api.github.com/gists/${gistId}`, {
      headers: { Authorization: `Bearer ${pat}`, Accept: 'application/vnd.github+json' }
    });

    showToast('✅ Gistからキーを読み込みました');

}

// ── Drive 共有DB（channelos-shared.json）──
const SHARED_FILENAME = 'channelos-shared.json';
let sharedFileId = null;

async function driveRequest(url, options = {}) {
  const token = await getGDToken();
  if (!token) { showToast('Drive未認証。設定タブでサービスアカウントを設定してください'); return null; }
  const res = await fetch(url, { ...options, headers: { Authorization: `Bearer ${token}`, ...(options.headers||{}) } });
  if (res.status === 401) { localStorage.removeItem(SA_EXPIRY_SK); showToast('Drive認証エラー。再試行してください'); return null; }
  return res;
}

async function findSharedFile() {
  const folderId = localStorage.getItem(GD_FOLDER_SK) || '1-QySS62i1cHPNh9lHg1quqPtyZ2zIp_x';
  const res = await driveRequest(`https://www.googleapis.com/drive/v3/files?q=name='${SHARED_FILENAME}'+and+'${folderId}'+in+parents&fields=files(id)`);
  if (!res) return null;
  const json = await res.json();
  return (json.files && json.files.length) ? json.files[0].id : null;
}

async function autoSaveToDrive() {
  const token = localStorage.getItem(GD_TOKEN_SK);
  if (!token) return;
  const folderId = localStorage.getItem(GD_FOLDER_SK) || '1-QySS62i1cHPNh9lHg1quqPtyZ2zIp_x';
  try {
    if (!sharedFileId) sharedFileId = await findSharedFile();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    if (sharedFileId) {
      await driveRequest(`https://www.googleapis.com/upload/drive/v3/files/${sharedFileId}?uploadType=media`, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: blob
      });
    } else {
      const meta = JSON.stringify({ name: SHARED_FILENAME, parents: [folderId] });
      const form = new FormData();
      form.append('metadata', new Blob([meta], { type: 'application/json' }));
      form.append('file', blob);
      const res = await driveRequest('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', body: form });
      if (res) { const j = await res.json(); sharedFileId = j.id; }
    }
    showSaveIndicator();
    setSyncStatus('ok', `保存済 (${(data.episodes||[]).length}プロジェクト)`);
  } catch(e) { setSyncStatus('error', `保存失敗: ${e.message}`); }
}

function setSyncStatus(status, msg) {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  const icons = { ok:'☁️', error:'⚠️', loading:'🔄', none:'—' };
  el.textContent = `${icons[status]||''} ${msg}`;
  el.style.color = status === 'error' ? '#e55' : status === 'ok' ? '#4caf50' : 'var(--text-muted)';
}

async function loadFromDrive() {
  const token = localStorage.getItem(GD_TOKEN_SK);
  if (!token) { setSyncStatus('none', 'Drive未接続'); return; }
  setSyncStatus('loading', '同期中...');
  try {
    if (!sharedFileId) sharedFileId = await findSharedFile();
    if (!sharedFileId) { await autoSaveToDrive(); setSyncStatus('ok', '新規作成完了'); return; }
    const res = await driveRequest(`https://www.googleapis.com/drive/v3/files/${sharedFileId}?alt=media`);
    if (!res) { setSyncStatus('error', '読込失敗（認証切れ？）'); return; }
    const remote = await res.json();
    if (!remote || !remote.characters) { setSyncStatus('error', 'データ破損'); return; }
    const localEpisodes = data.episodes || [];
    data = remote;
    data.episodes = data.episodes || [];
    localEpisodes.forEach(local => {
      if (!data.episodes.find(e => e.id === local.id)) data.episodes.push(local);
    });
    defaultData().characters.forEach(def => {
      const existing = data.characters.find(c => c.id === def.id);
      if (!existing) {
        data.characters.push(def);
      } else {
        ['drive_folder_id','channel_id','ai_personality','icon','color','species','theme','tone'].forEach(k => {
          if (!existing[k] && def[k]) existing[k] = def[k];
        });
      }
    });
    saveData(data);
    renderSidebar();
    if (currentCharId) renderMain();
    const epCount = (data.episodes||[]).length;
    setSyncStatus('ok', `同期完了 (${epCount}プロジェクト)`);
  } catch(e) {
    setSyncStatus('error', `エラー: ${e.message}`);
  }
}

async function generateVoicevox() {
  const char = data.characters.find(c => c.id === currentCharId);
  if (!generatedScript) { showToast('先に台本を生成してください'); return; }
  const speakerId = char.voicevox_speaker ?? 3;
  const text = parseScript(generatedScript).lines;
  if (!text) { showToast('台本のセリフが取得できませんでした'); return; }
  showToast('🎙 VOICEVOX に送信中… (localhost:50021 が起動している必要があります)');
  try {
    const qRes = await fetch(`http://localhost:50021/audio_query?text=${encodeURIComponent(text)}&speaker=${speakerId}`, { method: 'POST' });
    if (!qRes.ok) throw new Error('audio_query 失敗: ' + qRes.status + ' (VOICEVOXは起動していますか？)');
    const query = await qRes.json();
    const sRes = await fetch(`http://localhost:50021/synthesis?speaker=${speakerId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(query)
    });
    if (!sRes.ok) throw new Error('synthesis 失敗: ' + sRes.status);
    const blob = await sRes.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${char.name}_${(selectedPlan?.title||'script').replace(/[\\/:*?"<>|]/g,'_')}.wav`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    showToast('✅ 音声ファイルをダウンロードしました');
  } catch(e) {
    showToast('❌ ' + e.message);
  }
}

function splitScriptToScenes(linesText, format) {
  const lines = linesText.split('\n').filter(l => l.trim());
  const total = lines.length;
  const scenes = [];
  let idx = 0;

  function take(label, time, count) {
    if (idx >= lines.length) return;
    const n = Math.max(1, Math.min(count, lines.length - idx));
    scenes.push({ label, time, lines: lines.slice(idx, idx + n), prompt: '', imageDataUrl: '' });
    idx += n;
  }

  if (format === 'shorts') {
    take('フック',  '0〜2秒',  Math.max(1, Math.round(total * 0.08)));
    take('結論',    '3〜10秒', Math.max(1, Math.round(total * 0.13)));
    const reserved = Math.max(1, Math.round(total * 0.12));
    let ex = 1;
    while (idx < lines.length - reserved) {
      take(`理由・例${ex}`, '11〜45秒', 2);
      ex++;
    }
    take('CTA', '46〜60秒', lines.length - idx);
  } else {
    take('フック',   '0〜15秒',    Math.max(1, Math.round(total * 0.08)));
    take('課題提起', '15〜45秒',   Math.max(1, Math.round(total * 0.16)));
    const reserved = Math.max(1, Math.round(total * 0.09));
    let ex = 1;
    while (idx < lines.length - reserved) {
      take(`解決策 例${ex}`, '45〜150秒', 2);
      ex++;
    }
    take('行動喚起', '150〜180秒', lines.length - idx);
  }
  return scenes;
}

function initStoryboard(format) {
  if (!generatedScript) { showToast('先に台本を生成してください'); return; }
  const linesText = parseScript(generatedScript).lines;
  const scenes = splitScriptToScenes(linesText, format);
  const prev = storyboardData[currentCharId];
  // 既存プロンプト・画像を引き継ぐ
  if (prev && prev.scenes && prev.scenes.length === scenes.length) {
    scenes.forEach((s, i) => { s.prompt = prev.scenes[i].prompt || ''; s.imageDataUrl = prev.scenes[i].imageDataUrl || ''; });
  }
  storyboardData[currentCharId] = { format, scenes };
  saveStoryboard();
  const el = document.getElementById('storyboardContainer');
  if (el) el.innerHTML = renderStoryboard();
}

async function generateSceneImage(sceneIdx) {
  const openaiKey = localStorage.getItem('channelos_openai_api_key');
  if (!openaiKey) { showToast('設定タブで OpenAI API キーを入力してください'); return; }
  const sb = storyboardData[currentCharId];
  if (!sb) return;
  const char = data.characters.find(c => c.id === currentCharId);

  const scene = sb.scenes[sceneIdx];
  const basePrompt = `${char.name}(${char.species}), scene: ${scene.label}, dialogue: ${scene.lines.join(' ')}`;

  const btn = document.getElementById(`sbGenBtn${sceneIdx}`);
  if (btn) { btn.disabled = true; btn.textContent = '生成中…'; }

  try {
    let imageUrl;
    if (sb.charRefDataUrl) {
      // 参照画像あり → gpt-image-1 の edits エンドポイント（参照画像対応・透過PNG）
      const blob = await (await fetch(sb.charRefDataUrl)).blob();
      const pngBlob = await convertToPng(blob);
      const fd = new FormData();
      fd.append('model', 'gpt-image-1');
      fd.append('image[]', pngBlob, 'character.png');
      fd.append('prompt', `${basePrompt}. Transparent background, no background, isolated character only, full body or upper body, anime illustration style.`);
      fd.append('n', '1');
      fd.append('size', '1024x1024');
      const res = await fetch('https://api.openai.com/v1/images/edits', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${openaiKey}` },
        body: fd
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error?.message || 'API error ' + res.status);
      imageUrl = json.data[0].url || ('data:image/png;base64,' + json.data[0].b64_json);
    } else {
      // 参照画像なし → gpt-image-1 で透過生成
      const res = await fetch('https://api.openai.com/v1/images/generations', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${openaiKey}` },
        body: JSON.stringify({
          model: 'gpt-image-1',
          prompt: `${char.name} (${char.species}), ${basePrompt}. Transparent background, no background at all, isolated character only, anime illustration style, no text.`,
          n: 1, size: '1024x1024', output_format: 'png', background: 'transparent'
        })
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error?.message || 'API error ' + res.status);
      imageUrl = json.data[0].url || ('data:image/png;base64,' + json.data[0].b64_json);
    }
    sb.scenes[sceneIdx].imageDataUrl = imageUrl;
    saveStoryboard();
    const el = document.getElementById('storyboardContainer');
    if (el) el.innerHTML = renderStoryboard();
    showToast('✅ 画像生成完了');
  } catch(e) {
    showToast('❌ ' + e.message);
    const el = document.getElementById('storyboardContainer');
    if (el) el.innerHTML = renderStoryboard();
  }
}

async function convertToPng(blob) {
  // Canvas 経由で PNG に変換（JPEG など他形式の場合の対応）
  return new Promise(resolve => {
    const img = new Image();
    const url = URL.createObjectURL(blob);
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.width; c.height = img.height;
      c.getContext('2d').drawImage(img, 0, 0);
      URL.revokeObjectURL(url);
      c.toBlob(resolve, 'image/png');
    };
    img.src = url;
  });
}

function initCanvas() {
  sceneCanvas = document.getElementById('sceneCanvas');
  if (!sceneCanvas) return;
  sceneCtx = sceneCanvas.getContext('2d');
  resizeCanvas();
  drawScene();
}

function resizeCanvas() {
  if (!sceneCanvas) return;
  if (sceneFormat === 'horizontal') { sceneCanvas.width = 1920; sceneCanvas.height = 1080; }
  else { sceneCanvas.width = 1080; sceneCanvas.height = 1920; }
  sceneCanvas.style.maxWidth  = sceneFormat === 'horizontal' ? '100%' : '200px';
  sceneCanvas.style.maxHeight = '460px';
}

function setFormat(fmt) {
  sceneFormat = fmt;
  resizeCanvas();
  drawScene();
  // Re-render controls
  const panel = document.getElementById('panelScene');
  if (panel) {
    document.querySelectorAll('.format-btn').forEach(b => b.classList.toggle('active', b.textContent.includes(fmt==='horizontal'?'横':'ショート')));
  }
}

function drawScene() {
  if (!sceneCtx) return;
  const w = sceneCanvas.width, h = sceneCanvas.height;
  sceneCtx.clearRect(0, 0, w, h);

  // Background
  if (sceneBg && sceneBg.img) {
    sceneCtx.drawImage(sceneBg.img, 0, 0, w, h);
  } else {
    const g = sceneCtx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, '#1a1a2e'); g.addColorStop(1, '#16213e');
    sceneCtx.fillStyle = g;
    sceneCtx.fillRect(0, 0, w, h);
  }

  // Character
  if (sceneChar && sceneChar.img) {
    const ch = sceneChar;
    const scale = ch.scale || 0.5;
    const iw = sceneChar.img.naturalWidth  * scale * (w / 1920);
    const ih = sceneChar.img.naturalHeight * scale * (w / 1920);
    const x = (ch.x !== undefined ? ch.x * w : w * 0.5 - iw / 2);
    const y = (ch.y !== undefined ? ch.y * h : h - ih);
    sceneCtx.drawImage(sceneChar.img, x, y, iw, ih);
  }

  // Texts
  sceneTexts.forEach(t => {
    const size = (t.size || 48) * (w / 1920);
    sceneCtx.font = `${t.bold?'bold ':''} ${size}px 'Noto Serif JP', sans-serif`;
    sceneCtx.fillStyle = t.color || '#ffffff';
    sceneCtx.strokeStyle = 'rgba(0,0,0,0.8)';
    sceneCtx.lineWidth = size * 0.08;
    const tx = t.x !== undefined ? t.x * w : w / 2;
    const ty = t.y !== undefined ? t.y * h : h * 0.1 + size;
    sceneCtx.textAlign = 'center';
    sceneCtx.strokeText(t.text, tx, ty);
    sceneCtx.fillText(t.text, tx, ty);
  });
}

function addSceneText() {
  const text  = document.getElementById('sceneTextInput').value.trim();
  const size  = parseInt(document.getElementById('sceneTextSize').value) || 48;
  const color = document.getElementById('sceneTextColor').value;
  if (!text) return;
  sceneTexts.push({ text, size, color, x: 0.5, y: 0.1 + sceneTexts.length * 0.12 });
  drawScene();
  switchTab('scene');
}

function removeText(i) {
  sceneTexts.splice(i, 1);
  drawScene();
  switchTab('scene');
}

function exportPNG() {
  drawScene();
  const a = document.createElement('a');
  a.href = sceneCanvas.toDataURL('image/png');
  a.download = `scene_${Date.now()}.png`;
  a.click();
}

function exportWebM() {
  drawScene();
  const stream = sceneCanvas.captureStream(30);
  const rec = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
  const chunks = [];
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = () => {
    const blob = new Blob(chunks, { type: 'video/webm' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `scene_${Date.now()}.webm`;
    a.click();
  };
  // Record 3s (static frame loop)
  rec.start();
  let frames = 0;
  const id = setInterval(() => { drawScene(); if (++frames >= 90) { clearInterval(id); rec.stop(); } }, 1000/30);
}

async function loadDriveAssets() {
  const token    = localStorage.getItem(GD_TOKEN_SK);
  const folderId = getCharFolderId();
  const grid = document.getElementById('assetGrid');
  if (!grid) return;
  if (!token) { grid.innerHTML = `<p style="font-size:.8rem;color:var(--text-muted);">設定タブでGoogle Drive認証を行ってください</p>`; return; }

  grid.innerHTML = `<div class="loading"><div class="spinner"></div><span>Drive から読み込み中...</span></div>`;
  try {
    const res = await fetch(`https://www.googleapis.com/drive/v3/files?q='${folderId}'+in+parents+and+mimeType+contains+'image/'&fields=files(id,name,mimeType,thumbnailLink,webContentLink)&pageSize=100`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    if (res.status === 401) { localStorage.removeItem(GD_TOKEN_SK); grid.innerHTML = `<p style="font-size:.8rem;color:#e55;">認証切れです。再度ログインしてください</p>`; return; }
    const json = await res.json();
    driveAssets = (json.files || []).map(f => ({
      id: f.id, name: f.name, mimeType: f.mimeType,
      thumbUrl: f.thumbnailLink ? f.thumbnailLink.replace('=s220','=s400') : null,
      blobUrl: null
    }));
    renderAssetGrid();
    // フル画像はBlobURLで非同期ロード
    driveAssets.forEach((a, i) => loadDriveThumb(a, i, token));
  } catch(e) {
    grid.innerHTML = `<p style="font-size:.8rem;color:#e55;">エラー: ${e.message}</p>`;
  }
}

async function loadDriveThumb(asset, idx, token) {
  try {
    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${asset.id}?alt=media`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    driveAssets[idx].blobUrl = url;
    const img = document.getElementById(`asset-img-${idx}`);
    if (img) img.src = url;
  } catch(e) { /* サムネ失敗は無視 */ }
}

function renderAssetGrid() {
  const grid = document.getElementById('assetGrid');
  if (!grid) return;
  if (!driveAssets.length) { grid.innerHTML = `<p style="font-size:.8rem;color:var(--text-muted);">素材がありません。上からアップロードしてください</p>`; return; }
  grid.innerHTML = driveAssets.map((a, i) => `
    <div class="asset-card" onclick="useAssetInScene(${i})">
      <div class="asset-thumb">
        ${a.thumbUrl
          ? `<img src="${a.thumbUrl}" style="width:100%;height:100%;object-fit:cover;display:block;" onerror="this.style.display='none'">`
          : `<img id="asset-img-${i}" src="" style="width:100%;height:100%;object-fit:cover;display:block;" onerror="this.style.display='none'">`}
      </div>
      <div class="asset-name">${escHtml(a.name)}</div>
      <button class="asset-use-btn" onclick="event.stopPropagation();useAssetInScene(${i})">使う</button>
    </div>`).join('');
}

  const msg  = document.getElementById('uploadMsg');
  prog.style.display = 'flex';
  let done = 0;
  for (const file of Array.from(files)) {
    msg.textContent = `アップロード中: ${file.name} (${done+1}/${files.length})`;
    try {
      const meta = JSON.stringify({ name: file.name, parents: [folderId] });
      const form = new FormData();
      form.append('metadata', new Blob([meta], { type: 'application/json' }));
      form.append('file', file);
      const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name', {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}` },
        body: form
      });
      if (!res.ok) throw new Error('Upload failed: ' + res.status);
      done++;
    } catch(e) { showToast(`${file.name} のアップロードに失敗: ${e.message}`); }
  }
  prog.style.display = 'none';
  msg.textContent = '';
  loadDriveAssets();
}

async function generateSchedule() {
  const char  = data.characters.find(c => c.id === currentCharId);

  const freq  = document.getElementById('scheduleFreq').value;
  document.getElementById('scheduleLoading').style.display = 'flex';
  const prompt = `${char.name}（${char.theme}）のYouTubeチャンネル用に${month}の月間スケジュールを作成。週${freq}本。横動画とショートを混在させてください。
JSONのみ出力: [{"date":"YYYY-MM-DD","episode":1,"format":"horizontal|shorts","theme":"","title_idea":""}]`;
  try {
    const text = await callClaude(prompt);
    const schedule = JSON.parse(text.match(/\[[\s\S]*\]/)[0]);
    document.getElementById('scheduleLoading').style.display = 'none';
    document.getElementById('scheduleResult').innerHTML = `
      <div class="card">

      </div>`;
  } catch(e) {
    document.getElementById('scheduleLoading').style.display = 'none';

async function buildThumbnailForPublish(orientation) {
  const ep = currentEpisodeId ? (loadData().episodes || []).find(e => e.id === currentEpisodeId) : null;
  if (!ep) { showToast('エピソードを選択してください'); return; }
  const meta = ep.generatedMeta || {};
  const openaiKey = localStorage.getItem('channelos_openai_api_key');
  if (!openaiKey) { showToast('設定タブでOpenAI APIキーを入力してください'); return; }

  const isShorts = orientation === 'shorts';
  const W = isShorts ? 720 : 1280;
  const H = isShorts ? 1280 : 720;
  const promptText = isShorts
    ? (meta.thumb_shorts || `YouTube Shorts thumbnail for: ${meta.title||ep.theme||'動画'}`)
    : (meta.thumb_horizontal || `YouTube thumbnail for: ${meta.title||ep.theme||'動画'}`);
  const overlayText = isShorts
    ? (meta.thumb_text_shorts || meta.title || '')
    : (meta.thumb_text_horizontal || meta.title || '');

  showToast('🎨 DALL-E でサムネイル生成中...');
  try {
    const resp = await fetch('https://api.openai.com/v1/images/generations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${openaiKey}` },
      body: JSON.stringify({ model: 'dall-e-3', prompt: promptText, n: 1, size: isShorts ? '1024x1792' : '1792x1024', response_format: 'b64_json' })
    });
    if (!resp.ok) throw new Error(`DALL-E error: ${resp.status}`);
    const json = await resp.json();
    const b64 = json.data[0].b64_json;
    const imgDataUrl = `data:image/png;base64,${b64}`;

    // Canvas合成
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = imgDataUrl; });
    ctx.drawImage(img, 0, 0, W, H);

    // テキストオーバーレイ
    if (overlayText) {
      const fontSize = isShorts ? 72 : 60;
      ctx.font = `bold ${fontSize}px 'Noto Sans JP', sans-serif`;
      ctx.textAlign = 'center';
      ctx.shadowColor = '#000';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#ffffff';
      const lines = wrapText(ctx, overlayText, W - 80);
      const lineH = fontSize * 1.3;
      const totalH = lines.length * lineH;
      let y = isShorts ? H * 0.75 : H * 0.8;
      lines.forEach(line => { ctx.fillText(line, W / 2, y); y += lineH; });
    }

    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
    // Save to episode
    const d = loadData();
    const epIdx = d.episodes.findIndex(e => e.id === currentEpisodeId);
    if (epIdx >= 0) { d.episodes[epIdx].thumbnailDataUrl = dataUrl; saveData(d); }
    switchTab('publish');
    showToast('✅ サムネイル生成完了');
  } catch (e) {
    showToast('❌ サムネイル生成失敗: ' + e.message);
  }
}

function wrapText(ctx, text, maxWidth) {
  const words = text.split('');
  const lines = [];
  let line = '';
  for (const ch of words) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = ch;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines;
}

async function applyMetaToYouTube() {
  const ytToken = localStorage.getItem(YT_TOKEN_SK);
  if (!ytToken) { showToast('YouTube認証が必要です'); ytAuth(); return; }
  const videoId = document.getElementById('ytVideoId')?.value?.trim();
  if (!videoId) { showToast('動画IDを入力してください'); return; }
  const ep = currentEpisodeId ? (loadData().episodes || []).find(e => e.id === currentEpisodeId) : null;
  if (!ep) { showToast('エピソードを選択してください'); return; }
  const meta = ep.generatedMeta || {};
  if (!meta.title) { showToast('投稿情報を生成してください'); return; }

  showToast('📤 YouTube に適用中...');
  try {
    // 1. videos.update
    const updateResp = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${ytToken}` },
      body: JSON.stringify({
        id: videoId,
        snippet: {
          title: meta.title,
          description: meta.description || '',
          tags: meta.tags || [],
          categoryId: '22'
        }
      })
    });
    if (!updateResp.ok) {
      const err = await updateResp.json();
      throw new Error(err.error?.message || `videos.update failed (${updateResp.status})`);
    }

    // 2. thumbnails.set
    if (ep.thumbnailDataUrl) {
      const blob = await (await fetch(ep.thumbnailDataUrl)).blob();
      const thumbResp = await fetch(`https://www.googleapis.com/upload/youtube/v3/thumbnails/set?videoId=${videoId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'image/jpeg', 'Authorization': `Bearer ${ytToken}` },
        body: blob
      });
      if (!thumbResp.ok) {
        const err = await thumbResp.json();
        showToast('⚠️ サムネ適用失敗: ' + (err.error?.message || thumbResp.status));
      } else {
        showToast('✅ タイトル・説明・サムネイルを適用しました');
        return;
      }
    }
    showToast('✅ タイトル・説明・タグを適用しました（サムネイル未設定）');
  } catch (e) {
    showToast('❌ 適用失敗: ' + e.message);
  }
}

    },
    body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 4096, messages: [{ role: 'user', content: prompt }] })
  });
  if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.error?.message || 'API error '+res.status); }

async function downloadMaterialPack() {
  const sb = storyboardData[currentCharId];
  if (!sb || !sb.scenes || !sb.scenes.length) { showToast('先に絵コンテを生成してください'); return; }
  const char = data.characters.find(c => c.id === currentCharId);
  if (typeof JSZip === 'undefined') { showToast('JSZipが読み込まれていません。ページをリロードしてください'); return; }

  showToast('📦 ZIPを作成中...');
  const zip = new JSZip();
  const charName = char?.name || 'character';
  const format = sb.format || 'shorts';
  const dateStr = new Date().toISOString().slice(0,10).replace(/-/g,'');
  const folderName = `${charName}_${dateStr}`;
  const folder = zip.folder(folderName);

  // 1. 台本テキスト (script.txt)
  const scriptLines = sb.scenes.map((s, i) =>
    `=== シーン${i+1}: ${s.label} (${s.time}) ===\n${s.lines.join('\n')}`
  ).join('\n\n');
  folder.file('script.txt', scriptLines);

  // 2. シーン画像 (scene_01.png, scene_02.png ...)
  let imageCount = 0;
  for (let i = 0; i < sb.scenes.length; i++) {
    const scene = sb.scenes[i];
    if (scene.imageDataUrl && scene.imageDataUrl.startsWith('data:')) {
      const base64 = scene.imageDataUrl.split(',')[1];
      const ext = scene.imageDataUrl.includes('image/png') ? 'png' : 'jpg';
      folder.file(`scene_${String(i+1).padStart(2,'0')}.${ext}`, base64, { base64: true });
      imageCount++;
    }
  }

  // 3. キャラ参照画像 (char_ref.png)
  if (sb.charRefDataUrl && sb.charRefDataUrl.startsWith('data:')) {
    const base64 = sb.charRefDataUrl.split(',')[1];
    folder.file('char_ref.png', base64, { base64: true });
  }

  // 4. compile_video.py (FFmpegスクリプト)
  const pyScript = generateFFmpegScript(format, sb.scenes.length, charName);
  folder.file('compile_video.py', pyScript);

  // 5. README.txt
  const readme = `RBAI Channel OS - 素材パック
キャラクター: ${charName}
フォーマット: ${format === 'shorts' ? 'ショート（縦9:16 / 50秒）' : '横動画（16:9 / 180秒）'}
生成日: ${new Date().toLocaleDateString('ja-JP')}
シーン数: ${sb.scenes.length}
画像数: ${imageCount}

【使い方】
1. VOICEVOXで音声を生成（ChannelOSの「音声」タブ → WAVをDL）
2. audio.wav をこのフォルダに配置
3. Python で compile_video.py を実行:
   pip install ffmpeg-python pillow
   python compile_video.py
4. output.mp4 が生成されます

【YouTube投稿】
- ChannelOSの「メタ」タブでタイトル・概要欄・タグを生成
- 最適投稿時間も確認してください
`;
  folder.file('README.txt', readme);

  const blob = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${folderName}_materials.zip`;
  a.click();
  showToast(`✅ ZIPをDLしました（シーン${sb.scenes.length}個 / 画像${imageCount}枚）`);
}

function generateFFmpegScript(format, sceneCount, charName) {
  const isShorts = format === 'shorts';
  const totalDuration = isShorts ? 50 : 180;
  const width = isShorts ? 1080 : 1920;
  const height = isShorts ? 1920 : 1080;

  // シーンの秒数配分
  let sceneDurations;
  if (isShorts) {
    // ショート: フック2s / 結論8s / 理由例×n / CTA最後5s
    const middle = sceneCount - 2;
    const midDur = Math.floor((50 - 2 - 8 - 5) / Math.max(middle, 1));
    sceneDurations = [2, 8, ...Array(middle).fill(midDur), 5];
  } else {
    // 横動画: フック15s / 課題提起30s / 解決策÷n / 行動喚起30s
    const middle = sceneCount - 3;
    const midDur = Math.floor((180 - 15 - 30 - 30) / Math.max(middle, 1));
    sceneDurations = [15, 30, ...Array(middle).fill(midDur), 30];
  }
  // 合計秒数をtotalDurationに合わせて最後を調整
  const sumDur = sceneDurations.reduce((a, b) => a + b, 0);
  if (sceneDurations.length > 0) sceneDurations[sceneDurations.length - 1] += totalDuration - sumDur;

  return `#!/usr/bin/env python3
# -*- coding: utf-8 -*-
# RBAI Channel OS - 素材コンパイルスクリプト
# キャラクター: ${charName}
# フォーマット: ${isShorts ? 'ショート（9:16 / 50秒）' : '横動画（16:9 / 180秒）'}
#
# 必要: pip install ffmpeg-python pillow
# FFmpegも必要: https://ffmpeg.org/download.html
#
# 使い方: python compile_video.py
#   → output.mp4 が生成されます

import os
import subprocess
import glob
from pathlib import Path

SCRIPT_DIR = Path(__file__).parent
AUDIO_FILE = SCRIPT_DIR / "audio.wav"
OUTPUT_FILE = SCRIPT_DIR / "output.mp4"
WIDTH = ${width}
HEIGHT = ${height}
FPS = 30
CHAR_NAME = "${charName}"

# シーンファイルとその表示秒数（手動で調整可）
SCENE_DURATIONS = ${JSON.stringify(sceneDurations)}

def find_scenes():
    scenes = sorted(glob.glob(str(SCRIPT_DIR / "scene_*.png")) +
                    glob.glob(str(SCRIPT_DIR / "scene_*.jpg")))
    return scenes

def compile_video():
    scenes = find_scenes()
    if not scenes:
        print("ERROR: scene_XX.png/jpg が見つかりません")
        return

    print(f"シーン数: {len(scenes)}")
    for i, s in enumerate(scenes):
        print(f"  {i+1}: {Path(s).name}")

    durations = SCENE_DURATIONS[:len(scenes)]
    while len(durations) < len(scenes):
        durations.append(3)

    # 各シーンを指定秒数の動画に変換（背景黒 + キャラ画像センタリング）
    temp_clips = []
    for i, (scene_path, dur) in enumerate(zip(scenes, durations)):
        temp_out = str(SCRIPT_DIR / f"_tmp_{i:02d}.mp4")
        cmd = [
            "ffmpeg", "-y",
            "-loop", "1", "-t", str(dur), "-i", scene_path,
            "-vf", f"scale={WIDTH}:{HEIGHT}:force_original_aspect_ratio=decrease,"
                   f"pad={WIDTH}:{HEIGHT}:(ow-iw)/2:(oh-ih)/2:black",
            "-c:v", "libx264", "-pix_fmt", "yuv420p",
            "-r", str(FPS),
            temp_out
        ]
        print(f"[{i+1}/{len(scenes)}] {Path(scene_path).name} → {dur}秒")
        subprocess.run(cmd, check=True, capture_output=True)
        temp_clips.append(temp_out)

    # シーンを結合
    concat_list = str(SCRIPT_DIR / "_concat.txt")
    with open(concat_list, "w") as f:
        for clip in temp_clips:
            f.write(f"file '{clip}'\\n")

    merged = str(SCRIPT_DIR / "_merged.mp4")
    cmd = ["ffmpeg", "-y", "-f", "concat", "-safe", "0", "-i", concat_list,
           "-c", "copy", merged]
    subprocess.run(cmd, check=True, capture_output=True)

    # 音声合成
    if AUDIO_FILE.exists():
        cmd = [
            "ffmpeg", "-y",
            "-i", merged, "-i", str(AUDIO_FILE),
            "-map", "0:v", "-map", "1:a",
            "-c:v", "copy", "-c:a", "aac",
            "-shortest",
            str(OUTPUT_FILE)
        ]
        print("音声を合成中...")
        subprocess.run(cmd, check=True, capture_output=True)
    else:
        print("WARNING: audio.wav が見つかりません。映像のみ出力します")
        import shutil
        shutil.copy(merged, str(OUTPUT_FILE))

    # 一時ファイルを削除
    for f in temp_clips + [concat_list, merged]:
        try: os.remove(f)
        except: pass

    print(f"\\n✅ 完成: {OUTPUT_FILE}")
    print(f"   解像度: {WIDTH}x{HEIGHT}")
    print(f"   合計時間: {sum(durations)}秒")

if __name__ == "__main__":
    compile_video()
`;
}

function parseScript(raw) {
  try {
    const json = JSON.parse(raw.match(/\{[\s\S]*\}/)[0]);
    return { info: json.info || '', lines: json.lines || '' };
  } catch(e) {
    // JSON失敗時は全文をlinesとして表示
    return { info: '', lines: raw };
  }
}
